<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hawkins Training Lab</title>
<style>
:root{--red:#ff2a3d;--card:#12121f;--card2:#1b1b30;--text:#f2f2f7;--dim:#9a9ab5;--ok:#3ddc84;--bad:#ff5c6c;--gold:#ffd24a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse at top,#2a0a16 0,#07070d 55%) fixed #07070d;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h2,h3{margin:.6em 0 .4em}
h3{color:var(--red);letter-spacing:.08em;text-transform:uppercase;font-size:.95rem;margin-top:1.6em}
.logo{font-weight:900;font-size:1.5rem;letter-spacing:.12em;color:var(--red);text-shadow:0 0 12px #ff2a3d99;animation:flick 5s infinite}
.logo span{color:#fff;font-weight:700;font-size:.8em;letter-spacing:.2em}
@keyframes flick{0%,90%,100%{opacity:1}92%{opacity:.35}94%{opacity:1}96%{opacity:.6}}
.agent{margin:6px 0}
.xpbar,.timer,.bar{height:10px;background:#222238;border-radius:8px;overflow:hidden}
.xpbar i,.timer i,.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2a3d,#ff8a3d);width:0;transition:width .3s}
.timer{height:14px;margin-bottom:12px}.timer i{transition:width .2s linear;width:100%}
.dim{color:var(--dim)}.small{font-size:.85rem}
.card{background:var(--card);border:1px solid #2a2a45;border-radius:16px;padding:16px;margin:12px 0}
.card.daily{border-color:var(--gold);box-shadow:0 0 18px #ffd24a33}
.btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:1rem;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#2a2a45}.btn.small{padding:6px 12px;min-height:34px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gcard{background:var(--card2);color:var(--text);border:1px solid #2f2f50;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px}
.gcard:hover{border-color:var(--red)}.gcard.daily{border-color:var(--gold)}
.gi{font-size:2rem}.tag{color:var(--gold);font-size:.8rem}.best{color:var(--ok)}
.gbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px}
.qbox{font-size:2.4rem;font-weight:800;text-align:center;margin:14px 0;min-height:1.3em}
.qbox.small{font-size:1.25rem;font-weight:600;text-align:left;line-height:1.4}
.inp{background:#0b0b16;color:#fff;border:2px solid #34345a;border-radius:12px;padding:12px;font-size:1.2rem;flex:1;min-width:120px}
.fb{min-height:1.6em;font-weight:700;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.r{color:var(--red)}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--text);border:2px solid #34345a;border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--red)}.opt.right{border-color:var(--ok);background:#12301f}.opt.wrong{border-color:var(--bad);background:#35161c}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.sym{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;font-size:1.7rem;background:var(--card2);border:2px solid #34345a;border-radius:12px;color:#fff}
button.sym{cursor:pointer}
.crow{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0}
.crow.cur .slot{border-color:var(--gold);cursor:pointer}
.peg{min-width:80px;letter-spacing:3px;font-size:1.1rem}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px;margin:14px auto}
.pad{height:110px;border-radius:18px;border:0;opacity:.4;transition:.1s;cursor:pointer}
.pad.lit{opacity:1;filter:brightness(1.4);box-shadow:0 0 34px currentColor;transform:scale(.97)}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{background:var(--card2);border-radius:10px;padding:8px 12px}
.xpgain{font-size:1.4rem;font-weight:800;color:var(--gold);margin:12px 0}
.note{border-radius:10px;padding:10px;margin:8px 0;background:var(--card2)}
.note.up{border:1px solid var(--gold)}.note.vault{border:1px solid var(--ok)}.note.badge{border:1px solid #6a8cff}
.skill{display:flex;align-items:center;gap:10px;margin:8px 0}.skill .bar{flex:1}.skill b{min-width:120px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bd{background:var(--card2);border-radius:12px;padding:10px;text-align:center;font-size:.8rem}
.bd .e{font-size:1.8rem}.bd.locked{opacity:.3;filter:grayscale(1)}
.vault{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:12px;margin:8px 0}
.vault.locked{opacity:.5}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.hidden{display:none}
.mbox{background:var(--card);border:2px solid var(--red);border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 0 30px #ff2a3d55}
#rgrid{display:grid;gap:3px;justify-content:center;margin:10px 0}
.cell{width:44px;height:44px;border-radius:8px;background:#1d1d33;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.cell.w{background:#050509;border:1px solid #2a2a45}.cell.g{background:#3a3210}.cell.t{background:#2a1a30}
.cell .rb{background:var(--red);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
.cell .rb.crash{background:#fff;color:#000}
.pbox{background:#0b0b16;border:2px solid #2a2a45;border-radius:12px;padding:8px;margin:8px 0;cursor:pointer}
.pbox.on{border-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:34px}
.chip{background:var(--card2);border:1px solid #44446a;border-radius:8px;padding:5px 10px;font-weight:700}
canvas{width:100%;height:auto;border-radius:12px;border:1px solid #2a2a45;display:block}
.sl{margin:8px 0}.sl label{display:block;margin-bottom:4px}.sl input{width:100%}
.scr{letter-spacing:.3em;font-size:1.6rem;color:var(--gold)}
footer{text-align:center;color:var(--dim);margin-top:30px;font-size:.85rem}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>
<div id="modal" class="modal hidden"></div>

<script>
"use strict";
/* ============ EDIT THIS ============ */
const CONFIG={
  name:"Nami", age:11, from:"OG",
  rewards:[
    {lv:2, title:"A quick hello", text:"Level 2! Time for a proper introduction. I'm OG, a friend of your mom's.\n\nI made this lab for your birthday because I heard you're smart and you like sports, Stranger Things and ramen, and I figured a puzzle lab beats a boring card.\n\nYou don't have to reply or anything. Just play whatever's fun. Happy birthday, Nami!"},
    {lv:3, title:"Pro tip", text:"Here's a secret the best puzzle-solvers know: they don't get everything right. They get really good at figuring out WHY they got something wrong.\n\nEvery miss in this lab is hidden XP. Read the explanations and you'll level up faster than anyone who only goes for speed."},
    {lv:5, title:"Halfway there", text:"Halfway to Level 10. Respect.\n\nBonus mission: pick your favorite puzzle from the lab and challenge your mom or a friend to solve it. If you can explain how it works, you've truly mastered it.\n\nBest of luck. (Hint: the Robot Lab gets very sneaky.)"},
    {lv:7, title:"Level 7 Prize: Movie Night", text:"You've earned a Level 7 prize!\n\nShow this screen to your mom to claim ONE movie night: you pick the movie, you pick the snacks, and everyone else has to go along with your choice. (Ask her about the late bedtime clause.)"},
    {lv:10, title:"🍜 THE RAMEN COUPON", text:"LEVEL 10. LEGEND. You did it!\n\nThis coupon is good for ONE ramen outing at any place you choose, with as many toppings as you want.\n\nBring whoever you like: your mom, a friend, or the whole squad. Whether I come along is totally up to you, and either way is fine with me.\n\nShow this screen to your mom to set it up. Congratulations, Agent Nami!"}
  ]
};
/* ================================== */

const KEY="hawkinsLab_v1";
const DEF=()=>({xp:0,sk:{math:0,logic:0,memory:0,language:0,coding:0,physics:0},badges:{},streak:0,lastDay:"",best:{},plays:{},cbWins:0,seenCases:[],words:{},robot:{unlocked:1,done:{}},dailyDone:""});
let S;
try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=DEF()}
S.sk=Object.assign(DEF().sk,S.sk);S.robot=Object.assign(DEF().robot,S.robot);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}


const LV_STEP=40, SK_STEP=20;
const xpFor=n=>LV_STEP*n*(n-1)/2;
const levelOf=xp=>{let n=1;while(xp>=xpFor(n+1))n++;return n};
const skLevel=xp=>{let n=1;while(xp>=SK_STEP*(n+1)*n/2)n++;return n};
const RANKS=["Rookie","Scout","Trainee","Agent","Specialist","Operative","Expert","Elite","Master","Legend"];
const rank=lv=>RANKS[Math.min(lv,10)-1];

const $=s=>document.querySelector(s);
const view=$("#view");
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let timers=[],raf=0;
const later=(f,ms)=>{const t=setTimeout(f,ms);timers.push(t);return t};
const every=(f,ms)=>{const t=setInterval(f,ms);timers.push(t);return t};
function stopAll(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];cancelAnimationFrame(raf)}

const dstr=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const today=()=>dstr(new Date());
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
function streakNow(){return(S.lastDay===today()||S.lastDay===yest())?S.streak:0}
function touchStreak(){const t=today();if(S.lastDay===t)return;S.streak=(S.lastDay===yest())?S.streak+1:1;S.lastDay=t}

const SKILLS={math:["Math","🔢"],logic:["Logic","🧩"],memory:["Memory","💡"],language:["Language","📖"],coding:["Coding","🤖"],physics:["Physics","🏀"]};
const GAMES=[
 {id:"sprint",name:"Stat Sprint",icon:"⚡",skill:"math",desc:"60 seconds of mental math that adapts to you.",start:gSprint},
 {id:"ramen",name:"Ramen Shop",icon:"🍜",skill:"math",desc:"Run the shop: word problems with real-life math.",start:gRamen},
 {id:"code",name:"Code Breaker",icon:"🔐",skill:"logic",desc:"Crack the secret code using logic.",start:gCode},
 {id:"cases",name:"Case Files",icon:"🕵️",skill:"logic",desc:"Brain-teasers and riddles to solve.",start:gCases},
 {id:"lights",name:"Wall of Lights",icon:"🎄",skill:"memory",desc:"Remember the flashing pattern. Sometimes backwards!",start:gLights},
 {id:"words",name:"Word Wizard",icon:"📖",skill:"language",desc:"Learn power words and unscramble them.",start:gWords},
 {id:"robot",name:"Robot Lab",icon:"🤖",skill:"coding",desc:"Program a robot to reach the star.",start:gRobot},
 {id:"hoops",name:"Hoops Physics Lab",icon:"🏀",skill:"physics",desc:"Pick angle and power. Use real physics to score.",start:gHoops}
];
function dailyGame(){let h=0;for(const c of today())h=(h*31+c.charCodeAt(0))>>>0;return GAMES[h%GAMES.length]}

const BADGES=[
 {id:"first",icon:"🎟️",name:"First Day",desc:"Finish any game.",test:()=>true},
 {id:"roster",icon:"🎒",name:"Full Roster",desc:"Play all 8 games.",test:()=>Object.keys(S.plays).length>=GAMES.length},
 {id:"lv10",icon:"👑",name:"Legend",desc:"Reach Level 10.",test:()=>levelOf(S.xp)>=10},
 {id:"streak7",icon:"🔥",name:"Week Warrior",desc:"7-day streak.",test:()=>S.streak>=7},
 {id:"sprint15",icon:"⚡",name:"Speed Demon",desc:"15 right in one Stat Sprint.",test:c=>c.game==="sprint"&&c.correct>=15},
 {id:"chef",icon:"👩‍🍳",name:"Head Chef",desc:"Perfect 16/16 in Ramen Shop.",test:c=>c.game==="ramen"&&c.points>=16},
 {id:"cracker",icon:"🔓",name:"Code Cracker",desc:"Break the code in 4 guesses or fewer.",test:c=>c.game==="code"&&c.won&&c.guesses<=4},
 {id:"detective",icon:"🔍",name:"Detective",desc:"Solve all 5 Case Files in a session.",test:c=>c.game==="cases"&&c.correct===5},
 {id:"memory8",icon:"🧠",name:"Photographic",desc:"Reach round 8 in Wall of Lights.",test:c=>c.game==="lights"&&c.rounds>=8},
 {id:"wordsmith",icon:"✒️",name:"Wordsmith",desc:"Master 10 words.",test:()=>Object.values(S.words).filter(n=>n>=2).length>=10},
 {id:"roboticist",icon:"🛠️",name:"Roboticist",desc:"Clear all 6 Robot Lab levels.",test:()=>Object.keys(S.robot.done).length>=6},
 {id:"swish",icon:"🔥",name:"Nothing But Net",desc:"Hit a perfect swish.",test:c=>!!c.swish},
 {id:"daily",icon:"⭐",name:"Daily Driver",desc:"Complete a Daily Challenge.",test:c=>!!c.daily}
];

/* ---------- UI helpers ---------- */
function hdr(){
  const lv=levelOf(S.xp),lo=xpFor(lv),hi=xpFor(lv+1),pct=Math.round((S.xp-lo)/(hi-lo)*100),st=streakNow();
  $("#hdr").innerHTML=`<div class="logo">HAWKINS <span>TRAINING LAB</span></div>
  <div class="agent"><b>Agent ${esc(CONFIG.name)}</b> · Lv ${lv} ${rank(lv)}${st>0?` · 🔥 ${st}-day streak`:""}</div>
  <div class="xpbar"><i style="width:${pct}%"></i></div>
  <div class="dim small">${S.xp-lo} / ${hi-lo} XP to Level ${lv+1}</div>`;
  $("#foot").innerHTML=`Made for you by ${esc(CONFIG.from)}`;
}
function modal(html){const m=$("#modal");m.innerHTML=`<div class="mbox">${html}<div style="margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div></div>`;m.classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}
function openVault(i){
  const r=CONFIG.rewards[i];if(!r||levelOf(S.xp)<r.lv)return;
  modal(`<h2>${esc(r.title)}</h2><p>${esc(r.text).replace(/\{AGE\}/g,CONFIG.age).replace(/\n/g,"<br>")}</p><p class="dim">— ${esc(CONFIG.from)}</p>`);
}
function shell(g,inner){
  view.innerHTML=`<div class="gbar"><button class="btn small ghost" onclick="home()">← Lab</button><b>${g.icon} ${g.name}</b><span id="gstat" class="dim small"></span></div><div id="g" class="card">${inner}</div>`;
  window.scrollTo(0,0);
}
function play(id){const g=GAMES.find(x=>x.id===id);stopAll();g.start(g)}

function home(){
  stopAll();hdr();
  const lv=levelOf(S.xp),dg=dailyGame(),dDone=S.dailyDone===today();
  view.innerHTML=`
  <section class="card daily"><div class="small" style="color:var(--gold)">⭐ DAILY CHALLENGE</div>
   ${dDone?`<h2>✅ Done for today!</h2><div class="dim">Come back tomorrow for a new one.</div>`
   :`<h2>${dg.icon} ${dg.name} — 2× XP</h2><div class="dim">${dg.desc}</div><div class="row"><button class="btn" onclick="play('${dg.id}')">Start challenge</button></div>`}</section>
  <h3>Training Games</h3>
  <div class="grid">${GAMES.map(g=>{const d=g.id===dg.id&&!dDone;return `<button class="gcard${d?" daily":""}" onclick="play('${g.id}')"><div class="gi">${g.icon}</div><b>${g.name}</b><div class="tag">${SKILLS[g.skill][1]} ${SKILLS[g.skill][0]}</div><div class="dim small">${g.desc}</div><div class="small best">${S.best[g.id]!=null?"Best: "+S.best[g.id]:"✨ New!"}${d?" · 2× XP":""}</div></button>`}).join("")}</div>
  <h3>Skills</h3><div class="card">${Object.keys(SKILLS).map(k=>{const xp=S.sk[k],l=skLevel(xp),lo=SK_STEP*l*(l-1)/2,hi=SK_STEP*(l+1)*l/2;return `<div class="skill"><b>${SKILLS[k][1]} ${SKILLS[k][0]} Lv ${l}</b><div class="bar"><i style="width:${Math.round((xp-lo)/(hi-lo)*100)}%"></i></div></div>`}).join("")}</div>
  <h3>Badges (${Object.keys(S.badges).length}/${BADGES.length})</h3>
  <div class="badges">${BADGES.map(b=>{const has=S.badges[b.id];return `<div class="bd${has?"":" locked"}"><div class="e">${b.icon}</div><b>${b.name}</b><div class="dim">${b.desc}</div></div>`}).join("")}</div>
  <h3>${esc(CONFIG.from)}'s Vault</h3>
  ${CONFIG.rewards.map((r,i)=>lv>=r.lv?`<div class="vault"><div><b>🔓 ${esc(r.title)}</b></div><button class="btn small" onclick="openVault(${i})">Open</button></div>`:`<div class="vault locked"><div><b>🔒 ???</b><div class="dim small">Unlocks at Level ${r.lv}</div></div></div>`).join("")}`;
  window.scrollTo(0,0);
}

function finish(g,ctx,baseXp,body,extra){
  stopAll();
  const daily=dailyGame().id===g.id&&S.dailyDone!==today();
  let xp=Math.max(0,Math.round(baseXp));if(daily)xp*=2;
  const lv0=levelOf(S.xp);
  touchStreak();
  S.xp+=xp;S.sk[g.skill]=(S.sk[g.skill]||0)+xp;
  S.plays[g.id]=(S.plays[g.id]||0)+1;
  if(ctx.score!=null&&ctx.score>(S.best[g.id]||0))S.best[g.id]=ctx.score;
  if(daily)S.dailyDone=today();
  ctx.game=g.id;ctx.daily=daily;
  const lv1=levelOf(S.xp);
  const nb=BADGES.filter(b=>!S.badges[b.id]&&b.test(ctx));
  nb.forEach(b=>S.badges[b.id]=1);
  save();
  let notes="";
  if(lv1>lv0)notes+=`<div class="note up">🎉 <b>LEVEL UP!</b> You are now Level ${lv1} — ${rank(lv1)}</div>`;
  CONFIG.rewards.forEach((r,i)=>{if(r.lv>lv0&&r.lv<=lv1)notes+=`<div class="note vault">🔓 New Vault item unlocked: <b>${esc(r.title)}</b> <button class="btn small" onclick="openVault(${i})">Open</button></div>`});
  nb.forEach(b=>notes+=`<div class="note badge">${b.icon} New badge: <b>${b.name}</b> — ${b.desc}</div>`);
  hdr();
  view.innerHTML=`<div class="card"><h2>${ctx.title||"Session complete"}</h2>${body}<div class="xpgain">+${xp} XP${daily?" · 2× Daily Challenge bonus!":""}</div>${notes}<div class="row"><button class="btn" onclick="play('${g.id}')">Play again</button>${extra||""}<button class="btn ghost" onclick="home()">Back to Lab</button></div></div>`;
  window.scrollTo(0,0);
}
const stat=(l,v)=>`<div><div class="dim small">${l}</div><b>${v}</b></div>`;

/* ================= 1. STAT SPRINT ================= */
function genMath(d){
  let x,y,z,q,a,c=rnd(0,2);
  if(d===1){ if(c===0){x=rnd(3,15);y=rnd(2,15);q=x+" + "+y;a=x+y}else{x=rnd(10,25);y=rnd(2,x-1);q=x+" − "+y;a=x-y} }
  else if(d===2){ if(c===0){x=rnd(20,80);y=rnd(11,40);q=x+" + "+y;a=x+y}else if(c===1){x=rnd(40,99);y=rnd(11,x-1);q=x+" − "+y;a=x-y}else{x=rnd(2,5);y=rnd(2,10);q=x+" × "+y;a=x*y} }
  else if(d===3){ if(c===0){x=rnd(3,12);y=rnd(3,12);q=x+" × "+y;a=x*y}else if(c===1){x=rnd(100,450);y=rnd(50,300);q=x+" + "+y;a=x+y}else{x=rnd(300,900);y=rnd(50,299);q=x+" − "+y;a=x-y} }
  else if(d===4){ if(c===0){x=rnd(11,25);y=rnd(3,9);q=x+" × "+y;a=x*y}else if(c===1){y=rnd(3,12);a=rnd(5,15);x=y*a;q=x+" ÷ "+y}else{x=rnd(6,12);y=rnd(6,12);z=rnd(5,30);q=x+" × "+y+" + "+z;a=x*y+z} }
  else if(d===5){ if(c===0){const p=pick([5,10,20,25,50]),b=rnd(2,20)*20;q=p+"% of "+b;a=b*p/100}else if(c===1){x=rnd(12,19);y=rnd(11,19);q=x+" × "+y;a=x*y}else{x=rnd(3,9);y=rnd(2,9);z=rnd(2,9);q=x+" + "+y+" × "+z;a=x+y*z} }
  else { if(c===0){x=rnd(5,19);y=rnd(5,19);z=rnd(3,9);q="("+x+" + "+y+") × "+z;a=(x+y)*z}else if(c===1){x=rnd(13,25);q=x+"²";a=x*x}else{y=rnd(6,15);a=rnd(12,40);x=y*a;q=x+" ÷ "+y} }
  return{q,a};
}
function gSprint(g){
  let d=Math.min(4,1+Math.floor((skLevel(S.sk.math)-1)/2)),maxD=d,good=0,miss=0,rs=0,ws=0,pts=0,cur,over=false;
  shell(g,`<div class="timer"><i id="tb"></i></div><div class="qbox" id="sq"></div>
  <div class="row"><input id="sa" class="inp" inputmode="numeric" autocomplete="off" placeholder="answer"><button class="btn" id="sgo">Go</button></div>
  <div class="fb" id="sfb">&nbsp;</div><div class="dim small" id="sst"></div>`);

const SYMS=["🍜","🏀","⚡","🎲","🍕","🎧"];
function cbScore(code,guess){let b=0;const cc=[],gc=[];for(let i=0;i<4;i++){if(code[i]===guess[i])b++;else{cc.push(code[i]);gc.push(guess[i])}}let w=0;gc.forEach(x=>{const k=cc.indexOf(x);if(k>-1){w++;cc.splice(k,1)}});return[b,w]}
function gCode(g){
  const rep=S.cbWins>=2;
  const code=rep?[0,0,0,0].map(()=>rnd(0,5)):shuffle([0,1,2,3,4,5]).slice(0,4);
  let cur=[],hist=[],done=false;
  shell(g,`<div class="note"><b>How to play</b><br>
  A secret code of 4 symbols is hidden. Tap 4 symbols, then press Submit. You get clues after each guess:<br>
  <b class="r">●</b> = a symbol is correct <b>and</b> in the right spot<br>
  ○ = a symbol is in the code but in the <b>wrong</b> spot<br>
  The dots are shuffled, so they don't say <i>which</i> symbol they're about. Work it out! You have 10 guesses.<br>
  <b>${rep?"This round symbols CAN repeat (like 🍜🍜🏀⚡).":"This round all 4 symbols are DIFFERENT. No repeats."}</b></div><div id="cb"></div>`);
  function draw(){
    const rows=hist.map((h,n)=>`<div class="crow"><span class="dim">${n+1}</span>${h.g.map(s=>`<span class="sym">${SYMS[s]}</span>`).join("")}<span class="peg">${"<b class='r'>●</b>".repeat(h.b)}${"○".repeat(h.w)}${h.b+h.w===0?"–":""}</span><span class="dim small">${h.b} in place, ${h.w} misplaced</span></div>`).join("");
    let ctl="";
    if(!done)ctl=`<div class="crow cur">${[0,1,2,3].map(k=>`<span class="sym slot" data-k="${k}">${cur[k]!=null?SYMS[cur[k]]:"·"}</span>`).join("")}</div>
    <div class="pal">${SYMS.map((s,k)=>{const used=!rep&&cur.includes(k);return `<button class="sym pb" data-s="${k}" ${used?'disabled style="opacity:.3;cursor:default"':""}>${s}</button>`}).join("")}</div>
    <div class="dim small" style="text-align:center">Tap a slot to remove that symbol.</div>
    <div class="row" style="justify-content:center"><button class="btn" id="cbs" ${cur.length<4?"disabled":""}>Submit guess ${hist.length+1}/10</button><button class="btn ghost" id="cbc">Clear</button></div>`;
    $("#cb").innerHTML=rows+ctl;
    if(done)return;

      const [b,w]=cbScore(code,cur);hist.push({g:cur.slice(),b,w});cur=[];
      if(b===4){done=true;S.cbWins++;save();draw();later(()=>finish(g,{score:11-hist.length,won:true,guesses:hist.length,title:"🔓 Code cracked!"},30+(10-hist.length)*5,`<p>You broke the code in <b>${hist.length}</b> guesses!</p><div class="crow">${code.map(s=>`<span class="sym">${SYMS[s]}</span>`).join("")}</div>`),900)}

      else draw();
    };
  }

function expand(main,f,cap){
  const out=[],st=[{a:main,i:0}];
  while(st.length){
    const fr=st[st.length-1];

    let h="";
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const ch=L.grid[y][x];let cls="cell",inner="";
      if(ch==="#")cls+=" w";else if(ch==="G"){cls+=" g";inner="⭐"}else if(trail.has(x+","+y))cls+=" t";
      if(bot.x===x&&bot.y===y)inner=`<div class="rb${crash?" crash":""}">${["▲","▶","▼","◀"][bot.d]}</div>`;
      h+=`<div class="${cls}">${inner}</div>`;
    }
    gr.innerHTML=h;
  }
  function drawProg(){
    const box=(k,label,max)=>`<div class="pbox${act===k?" on":""}" data-a="${k}"><b>${label}</b> <span class="dim small">${prog[k].length}/${max}</span><div class="chips">${prog[k].map((c,j)=>`<span class="chip" data-a="${k}" data-j="${j}">${LAB[c]}</span>`).join("")}</div></div>`;
    $("#rprog").innerHTML=box("main","Main",L.max)+(L.fn?box("f","F1 (your function)",L.fmax):"");
    document.querySelectorAll(".pbox").forEach(b=>b.onclick=()=>{if(running)return;act=b.dataset.a;drawProg()});
    document.querySelectorAll(".chip").forEach(c=>c.onclick=e=>{e.stopPropagation();if(running)return;prog[c.dataset.a].splice(+c.dataset.j,1);drawProg()});
    const cmds=["M","L","R"].concat(L.fn&&(act==="main"||L.rec)?["F"]:[]);
    $("#rpal").innerHTML=cmds.map(c=>`<button class="sym pb" data-c="${c}" style="width:auto;padding:0 16px">${c==="M"?"▲ Move":c==="L"?"⟲ Left":c==="R"?"⟳ Right":"F1"}</button>`).join("");
    document.querySelectorAll("#rpal .pb").forEach(b=>b.onclick=()=>{if(running)return;const max=act==="main"?L.max:L.fmax;if(prog[act].length<max){prog[act].push(b.dataset.c);drawProg()}});
  }
  function reset(){bot={x:sx,y:sy,d:1};trail=new Set();drawGrid()}
  function endRun(kind,over){
    stopAll();running=false;
    if(kind==="win"){
      const first=!S.robot.done[i],xp=first?(attempts===1?25:20):8;
      S.robot.done[i]=1;S.robot.unlocked=Math.max(S.robot.unlocked,Math.min(BOTS.length,i+2));save();
      msg("⭐ You did it!","ok");
      const used=prog.main.length+prog.f.length;
      later(()=>finish(g,{score:Object.keys(S.robot.done).length,title:`🤖 Level ${i+1} cleared!`},xp,`<p>Program size: <b>${used}</b> commands. Attempts: <b>${attempts}</b>.</p><p class="dim">${first?"First clear bonus!":"Replay: reduced XP."}</p>`,i+1<BOTS.length?`<button class="btn" onclick="robotLevel(${i+1})">Next level →</button>`:""),800);
    }else if(kind==="crash")msg("💥 Bumped into a wall! Fix your code and run again.","bad");
    else if(over)msg("♾️ Your program runs on and on (an infinite loop). Check what calls what!","bad");
    else msg("The robot stopped before reaching the ⭐. Try again!","bad");
  }
  function run(){
    if(running)return;reset();
    const {out,over}=expand(prog.main,prog.f,60);
    if(!out.length&&!over){msg("Add some commands first!","bad");return}
    attempts++;running=true;msg("Running…");let k=0;
    every(()=>{
      if(k>=out.length){endRun(null,over);return}
      const c=out[k++];
      if(c==="L")bot.d=(bot.d+3)%4;else if(c==="R")bot.d=(bot.d+1)%4;
      else{
        const nx=bot.x+DX[bot.d],ny=bot.y+DY[bot.d];
        if(nx<0||ny<0||nx>=W||ny>=H||L.grid[ny][nx]==="#"){drawGrid(true);endRun("crash");return}
        bot.x=nx;bot.y=ny;trail.add(nx+","+ny);
        if(L.grid[ny][nx]==="G"){drawGrid();endRun("win");return}
      }
      drawGrid();
    },280);
  }
  $("#rrun").onclick=run;
  $("#rres").onclick=()=>{if(!running){reset();msg("&nbsp;")}};
  $("#rclr").onclick=()=>{if(!running){prog={main:[],f:[]};act="main";drawProg();reset();msg("&nbsp;")}};
  drawGrid();drawProg();
}

/* ================= 8. HOOPS PHYSICS LAB ================= */
function gHoops(g){
  const SP=[["Close shot",3.0],["Free-throw line",4.6],["Mid-range",6.0],["Three-point line",6.75],["Deep three",8.0]];
  const H0=2.0,HH=3.05,GR=9.8;
  let si=0,tries=0,pts=0,busy=false,swishAny=false,ghost=[],log=[],spotDone=false;
  shell(g,`<div id="hp" class="dim"></div>
  <canvas id="cv" width="600" height="360"></canvas>
  <div class="sl"><label>Angle: <b id="av"></b>°</label><input type="range" id="ang" min="25" max="80" value="50"></div>
  <div class="sl"><label>Power: <b id="pv"></b> m/s</label><input type="range" id="pow" min="5" max="15" step="0.1" value="9"></div>
  <div class="dim small" id="ro"></div>
  <div class="row"><button class="btn" id="shoot">🏀 Shoot</button><button class="btn" id="nxt" style="display:none">Next spot →</button></div>
  <div class="fb" id="hmsg">&nbsp;</div>
  <div class="dim small">💡 Physics: horizontal speed never changes. Gravity only pulls down. Higher arcs drop into the hoop at a steeper angle.</div>`);
  const cv=$("#cv"),cx=cv.getContext("2d"),ang=$("#ang"),pow=$("#pow");
  const X=x=>40+x*55,Y=y=>330-y*55,D=()=>SP[si][1];
  function draw(ball,trail){
    cx.clearRect(0,0,600,360);
    const gr=cx.createLinearGradient(0,0,0,360);gr.addColorStop(0,"#10101c");gr.addColorStop(1,"#1d1020");cx.fillStyle=gr;cx.fillRect(0,0,600,360);
    cx.fillStyle="#3a2a1a";cx.fillRect(0,330,600,30);
    cx.fillStyle="#9a9ab5";cx.font="11px sans-serif";for(let m=0;m<=10;m+=2){cx.fillRect(X(m),330,1,6);cx.fillText(m+"m",X(m)-8,348)}
    cx.fillStyle="rgba(255,255,255,.28)";ghost.forEach((p,k)=>{if(k%3===0){cx.beginPath();cx.arc(X(p[0]),Y(p[1]),2.5,0,7);cx.fill()}});
    if(trail){cx.fillStyle="rgba(255,138,42,.6)";trail.forEach((p,k)=>{if(k%2===0){cx.beginPath();cx.arc(X(p[0]),Y(p[1]),2,0,7);cx.fill()}})}
    const d=D();
    cx.fillStyle="#666";cx.fillRect(X(d+0.6),Y(3.4),5,330-Y(3.4));
    cx.fillStyle="#ddd";cx.fillRect(X(d+0.375),Y(3.95),4,Y(2.95)-Y(3.95));
    cx.strokeStyle="#dddddd88";cx.lineWidth=1;cx.beginPath();cx.moveTo(X(d-0.225),Y(3.05));cx.lineTo(X(d-0.12),Y(2.55));cx.moveTo(X(d+0.225),Y(3.05));cx.lineTo(X(d+0.12),Y(2.55));cx.moveTo(X(d),Y(3.05));cx.lineTo(X(d),Y(2.55));cx.moveTo(X(d-0.12),Y(2.55));cx.lineTo(X(d+0.12),Y(2.55));cx.stroke();
    cx.strokeStyle="#ff6a2a";cx.lineWidth=4;cx.beginPath();cx.moveTo(X(d-0.225),Y(3.05));cx.lineTo(X(d+0.225),Y(3.05));cx.stroke();
    cx.strokeStyle="#ff2a3d";cx.lineWidth=4;cx.beginPath();cx.arc(X(-0.3),Y(1.75),8,0,7);cx.moveTo(X(-0.3),Y(1.6));cx.lineTo(X(-0.3),Y(0.85));cx.lineTo(X(-0.45),Y(0));cx.moveTo(X(-0.3),Y(0.85));cx.lineTo(X(-0.15),Y(0));cx.moveTo(X(-0.3),Y(1.4));cx.lineTo(X(-0.02),Y(1.95));cx.stroke();
    const b=ball||[0,H0];
    cx.fillStyle="#ff8a2a";cx.beginPath();cx.arc(X(b[0]),Y(b[1]),8,0,7);cx.fill();cx.strokeStyle="#5a2a00";cx.lineWidth=1.5;cx.beginPath();cx.arc(X(b[0]),Y(b[1]),8,0,7);cx.moveTo(X(b[0])-8,Y(b[1]));cx.lineTo(X(b[0])+8,Y(b[1]));cx.stroke();
  }
  function info(){
    const a=+ang.value,v=+pow.value,r=a*Math.PI/180,vx=v*Math.cos(r),vy=v*Math.sin(r);
    $("#av").textContent=a;$("#pv").textContent=v.toFixed(1);
    $("#ro").textContent=`Horizontal speed ${vx.toFixed(1)} m/s · Vertical speed ${vy.toFixed(1)} m/s · Peak height ${(H0+vy*vy/(2*GR)).toFixed(1)} m`;
    $("#hp").textContent=`Spot ${si+1}/5 — ${SP[si][0]} (${D()} m) · Try ${Math.min(tries+1,3)}/3 · Points ${pts}`;
  }
  ang.oninput=pow.oninput=info;
  function shoot(){
    if(busy||spotDone)return;busy=true;$("#shoot").disabled=true;
    const a=+ang.value,v=+pow.value,r=a*Math.PI/180,vx=v*Math.cos(r),vy=v*Math.sin(r),d=D();
    const disc=vy*vy-2*GR*(HH-H0);let res,e=0;
    if(disc<0)res="low";
    else{const tr=(vy+Math.sqrt(disc))/GR,xr=vx*tr;e=xr-d;res=Math.abs(e)<=0.2?(Math.abs(e)<=0.08?"swish":"made"):(e<0?"short":"long")}
    const made=res==="made"||res==="swish",tr=[];let t0=null;
    function after(){
      busy=false;tries++;ghost=tr.slice();let m;
      if(made){const p=[3,2,1][tries-1]+(res==="swish"?1:0);pts+=p;if(res==="swish")swishAny=true;log.push(`${SP[si][0]}: ${p} pts${res==="swish"?" 🔥 swish":""}`);m=(res==="swish"?"🔥 SWISH! Nothing but net!":"✅ Bucket!")+` +${p}`;spotDone=true}
      else{
        m=res==="low"?"The ball never reached rim height. Add power or angle.":res==="short"?`Short by about ${Math.abs(e).toFixed(1)} m. Add some power.`:`Long by about ${Math.abs(e).toFixed(1)} m. Ease off the power or lower the angle.`;
        if(tries>=3){log.push(`${SP[si][0]}: 0 pts`);spotDone=true;m+=" Out of tries."}
      }
      $("#hmsg").innerHTML=m;
      if(spotDone){$("#nxt").style.display="";$("#nxt").textContent=si>=4?"See results →":"Next spot →";$("#shoot").style.display="none"}else $("#shoot").disabled=false;
      draw(null,null);info();
    }
    function frame(ts){
      if(t0===null)t0=ts;
      const t=(ts-t0)/1000*1.5,x=vx*t,y=H0+vy*t-0.5*GR*t*t;tr.push([x,y]);
      const stop=(made&&x>d-0.5&&y<2.45)||(!made&&x>=d+0.375&&y>2.95&&y<3.95)||(y<0.12&&t>0.05)||x>10.2;
      draw([x,y],tr);
      if(stop)after();else raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }
  $("#shoot").onclick=shoot;
  $("#nxt").onclick=()=>{
    si++;
    if(si>4){finish(g,{score:pts,swish:swishAny,title:"🏀 Practice over"},pts*4,`<div class="stats">${stat("Points",pts+"/20")}</div><p>${log.map(esc).join("<br>")}</p>`);return}
    tries=0;spotDone=false;ghost=[];$("#nxt").style.display="none";$("#shoot").style.display="";$("#shoot").disabled=false;$("#hmsg").innerHTML="&nbsp;";draw(null,null);info();
  };
  draw(null,null);info();
}

hdr();home();
</script>
